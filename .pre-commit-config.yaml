---
repos:
  # -------------------------
  # Generic sanity checks
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^app/src-tauri/assets/test_data/
      - id: end-of-file-fixer
        exclude: ^app/src-tauri/assets/test_data/
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # -------------------------
  # Markdown formatting
  # -------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        name: prettier markdown
        types_or: [markdown]
        args: [--prose-wrap=always]
        # args: [--prose-wrap=always, --embedded-language-formatting=off]

  # -------------------------
  # CI formatting
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Accept GitHub Actions `on` and capitalized YAML booleans.
        args:
          - --config-data
          - |
            extends: default
            rules:
              truthy:
                allowed-values: ['true', 'false', 'True', 'False', 'on']

  - repo: https://github.com/shenxianpeng/hadolint-pre-commit
    # This wrapper bundles Hadolint 2.15.1 in prek's isolated environment.
    rev: v2.15.1.2
    hooks:
      - id: hadolint
        # Allow latest image tags and distro-managed APT package versions.
        args:
          - --ignore
          - DL3007  # Allow `latest` Docker image tags.
          - --ignore
          - DL3008  # Allow APT packages without explicit version pins.

  # -------------------------
  # Rust formatting
  # -------------------------
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      # -------------------------
      # Rust linting (clippy)
      # -------------------------
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # -------------------------
      # Rust compile check (fast)
      # -------------------------
      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets --all-features
        language: system
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bun --cwd app run typecheck
        language: system
        files: ^app/.*\.(ts|tsx|json)$
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint
        entry: bun --cwd app run lint
        language: system
        files: ^app/.*\.(ts|tsx|js|json)$
        pass_filenames: false

      - id: frontend-format
        name: frontend format check
        entry: bun --cwd app run format:check
        language: system
        files: ^app/.*\.(ts|tsx|js|json|css|html)$
        pass_filenames: false
