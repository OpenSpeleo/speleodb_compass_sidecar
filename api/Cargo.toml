[package]
name = "api"
version.workspace = true
edition = "2024"

[dependencies]
# Local dependencies
common = { path = "../common" }
# workspace dependencies
bytes.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

#Cargo dependencies
speleodb-api = "=0.1.1"
reqwest = { version = "0.13.4", features = ["json", "rustls", "multipart"] }

[dev-dependencies]
# Additional test infrastructure (Tokio is also used by read-only API retries).
serial_test = "4"
dotenvy = "0.15"
ctor = "1.0"
tempfile = "3"
zip = "9"
