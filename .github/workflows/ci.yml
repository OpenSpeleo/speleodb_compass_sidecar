---
name: "CI Tests"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/.bun-version
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: >-
            ${{ runner.os }}-bun-${{
            hashFiles('app/.bun-version', 'app/bun.lock') }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: app
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ubuntu-lint
      - name: Run all lint checks
        run: make lint
      - name: Verify release workflow contracts
        run: cargo test -p xtask --test release_workflow

  test:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    env:
      TEST_SPELEODB_INSTANCE: ${{ secrets.TEST_SPELEODB_INSTANCE }}
      TEST_SPELEODB_OAUTH: ${{ secrets.TEST_SPELEODB_OAUTH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/.bun-version
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: >-
            ${{ runner.os }}-bun-${{
            hashFiles('app/.bun-version', 'app/bun.lock') }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
      # Cache Rust dependencies and build artifacts
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ matrix.platform }}-test
      - name: Require API credentials for trusted pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ -z "$TEST_SPELEODB_INSTANCE" ] ||
             [ -z "$TEST_SPELEODB_OAUTH" ]; then
            echo "Trusted push tests require TEST_SPELEODB_INSTANCE" \
              "and TEST_SPELEODB_OAUTH secrets."
            exit 1
          fi
      - name: Run native tests
        run: cargo test --workspace --locked
      - name: Install browser engines
        run: bunx --no-install playwright install chromium webkit
        working-directory: app
      - name: Run frontend tests
        run: bun run test:ui
        working-directory: app
      - name: Build frontend
        run: bun run build:release
        working-directory: app
      - name: Build native application
        run: bun run tauri build --no-bundle
        working-directory: app
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-results-${{ matrix.platform }}
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore

  trigger-release:
    name: Trigger release
    needs: [test]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch latest tags
        run: git fetch --tags --force

      - name: Dispatch release if commit is tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(git tag --points-at HEAD --sort=-version:refname |
            grep '^v' | head -1)
          if [ -z "$TAG" ]; then
            echo "No v* tag on HEAD — skipping release"
            exit 0
          fi
          echo "Found tag $TAG — dispatching publish workflow"
          gh workflow run publish.yml --ref "$TAG"
