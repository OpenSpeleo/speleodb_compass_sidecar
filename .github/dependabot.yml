---
# Config for Dependabot updates. See Documentation here:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Update GitHub actions in workflows
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 25
    directory: "/"
    # Every weekday
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    open-pull-requests-limit: 50
    # Only change requirements when a release falls outside the current range.
    # Cargo does not support the "widen" strategy.
    versioning-strategy: "increase-if-necessary"
    # Keep dependency PRs limited to Cargo.toml; refresh locks manually.
    exclude-paths:
      - "**/Cargo.lock"
    directories:
      - "/"
      - "/api"
      - "/app/src-tauri"
      - "/common"
      - "/xtask"
    # Every weekday
    schedule:
      interval: "weekly"

  - package-ecosystem: "bun"
    directory: "/app"
    open-pull-requests-limit: 25
    # Keep the existing floor; only extend the next-major upper bound.
    versioning-strategy: "widen"
    allow:
      - dependency-type: "direct"
    # Within-range updates would only churn bun.lock. Update it together with
    # the manifest when a new major requires a wider upper bound instead.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    schedule:
      interval: "weekly"
